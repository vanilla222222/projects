<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Evolution Sim</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
	<link rel="stylesheet" href="css/style.css" />
</head>
<body>
	<header class="topbar">
		<div class="brand">
			<span class="brand-mark" id="brandMark"></span>
			<div>
				<h1>Evolution Sim</h1>
				<p>A living world of evolving plants &amp; animals</p>
			</div>
		</div>

		<div class="world-controls">
			<label class="field">
				<span>Seed</span>
				<input id="seedInput" type="number" step="1" />
			</label>
			<button id="randomSeedBtn" class="btn ghost icon-btn" title="Random seed">
				<svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/><circle cx="16" cy="16" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="16" cy="8" r="1.5" fill="currentColor"/><circle cx="8" cy="16" r="1.5" fill="currentColor"/></svg>
			</button>
			<label class="field">
				<span>Size</span>
				<select id="sizeSelect">
					<option value="220x150">Small</option>
					<option value="320x210" selected>Medium</option>
					<option value="460x300">Large</option>
					<option value="640x420">Huge</option>
				</select>
			</label>
			<button id="newWorldBtn" class="btn">New world</button>
		</div>

		<div class="transport">
			<button id="playBtn" class="btn primary play" title="Play / pause (Space)">
				<svg class="i-play" viewBox="0 0 24 24" width="18" height="18"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>
				<svg class="i-pause" viewBox="0 0 24 24" width="18" height="18"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z" fill="currentColor"/></svg>
				<span id="playLabel">Play</span>
			</button>
			<button id="stepBtn" class="btn ghost icon-btn" title="Step one tick (.)">
				<svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 5v14l10-7z M16.5 5h2.5v14h-2.5z" fill="currentColor"/></svg>
			</button>
			<div class="speed" id="speedGroup" role="group" aria-label="Speed">
				<button data-speed="4">¼×</button>
				<button data-speed="15" class="active">1×</button>
				<button data-speed="45">3×</button>
				<button data-speed="120">8×</button>
				<button data-speed="600">Max</button>
			</div>
		</div>

		<div class="clock">
			<div class="season" id="seasonBadge"><span class="season-dot"></span><span id="seasonLabel">Spring</span></div>
			<div class="clock-text"><strong id="yearLabel">Year 1</strong><span id="tickLabel">tick 0</span></div>
			<div class="perf" id="perfLabel" title="Simulation cost per tick · frames per second">–</div>
		</div>
	</header>

	<main class="layout">
		<aside class="panel left">
			<section class="card">
				<div class="card-head">
					<h2>Ecosystem</h2>
					<span class="muted" id="speciesTotals"></span>
				</div>
				<div class="stats" id="statCards"></div>
			</section>

			<section class="card">
				<div class="card-head">
					<h2>Populations</h2>
					<span class="muted">log scale</span>
				</div>
				<canvas id="popChart" class="chart"></canvas>
				<div class="legend" id="popLegend"></div>
			</section>

			<section class="card">
				<div class="card-head"><h2>Map</h2></div>
				<div class="seg" id="viewModes">
					<button data-mode="biome" class="active">Biomes</button>
					<button data-mode="vegetation">Plants</button>
					<button data-mode="temperature">Heat</button>
					<button data-mode="humidity">Moisture</button>
					<button data-mode="altitude">Height</button>
					<button data-mode="fertility">Soil</button>
				</div>
				<div class="toggles">
					<label class="switch"><input type="checkbox" id="showPlants" checked /><span></span>Plant cover</label>
					<label class="switch"><input type="checkbox" id="showAnimals" checked /><span></span>Animals</label>
					<label class="switch"><input type="checkbox" id="optSeasons" checked /><span></span>Seasons</label>
					<label class="switch" title="Re-introduce a trophic group if it dies out"><input type="checkbox" id="optMigrations" checked /><span></span>Migrations</label>
				</div>
				<details class="biome-legend">
					<summary>Biome legend</summary>
					<div id="biomeLegend"></div>
				</details>
			</section>
		</aside>

		<section class="map-wrap" id="mapWrap">
			<canvas id="map"></canvas>
			<div class="map-tooltip" id="tooltip" hidden></div>
			<div class="map-controls">
				<button id="zoomIn" title="Zoom in">+</button>
				<button id="zoomOut" title="Zoom out">−</button>
				<button id="zoomFit" title="Fit map">
					<svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
				</button>
			</div>
			<div class="map-hint" id="mapHint">Scroll to zoom · drag to pan · click a creature or plant to inspect it</div>
			<div class="map-error" id="mapError" hidden></div>
		</section>

		<aside class="panel right">
			<nav class="tabs" id="tabs">
				<button data-tab="plant" class="active"><span class="tab-icon" data-icon="plant"></span>Plants <em id="countPlant">0</em></button>
				<button data-tab="land"><span class="tab-icon" data-icon="paw"></span>Land <em id="countLand">0</em></button>
				<button data-tab="water"><span class="tab-icon" data-icon="wave"></span>Water <em id="countWater">0</em></button>
				<button data-tab="events">Events</button>
			</nav>

			<div class="tab-body" id="speciesView">
				<div class="list-tools">
					<label class="switch small"><input type="checkbox" id="showExtinct" /><span></span>Show extinct</label>
					<select id="sortSelect">
						<option value="pop">By population</option>
						<option value="new">Newest first</option>
						<option value="name">By name</option>
					</select>
				</div>
				<ul class="species-list" id="speciesList"></ul>
			</div>

			<div class="tab-body" id="eventsView" hidden>
				<div class="list-tools">
					<div class="seg small" id="eventFilter">
						<button data-f="all" class="active">All</button>
						<button data-f="speciation">New species</button>
						<button data-f="extinction">Extinct</button>
						<button data-f="migration">Migrations</button>
					</div>
				</div>
				<ul class="event-list" id="eventList"></ul>
			</div>

			<div class="detail" id="detail" hidden>
				<div class="detail-head">
					<button class="back" id="detailBack" title="Back to list">
						<svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
					</button>
					<div class="detail-icon" id="detailIcon"></div>
					<div class="detail-title">
						<h3 id="detailName"></h3>
						<p id="detailSub"></p>
					</div>
				</div>
				<div class="detail-badges" id="detailBadges"></div>
				<div class="detail-grid" id="detailGrid"></div>
				<h4>Population</h4>
				<canvas id="speciesChart" class="chart small"></canvas>
				<h4>Traits <span class="muted">population average</span></h4>
				<div class="traits" id="detailTraits"></div>
				<h4>Lineage</h4>
				<div class="lineage" id="detailLineage"></div>
				<div id="detailChildrenWrap">
					<h4>Descendants</h4>
					<div class="chips" id="detailChildren"></div>
				</div>
			</div>
		</aside>
	</main>

	<script src="js/noise.js"></script>
	<script src="js/biomes.js"></script>
	<script src="js/mapGenerator.js"></script>
	<script src="js/sim/core.js"></script>
	<script src="js/sim/plants.js"></script>
	<script src="js/sim/animals.js"></script>
	<script src="js/sim/ecosystem.js"></script>
	<script src="js/icons.js"></script>
	<script src="js/render.js"></script>
	<script src="js/charts.js"></script>
	<script src="js/main.js"></script>
</body>
</html>
