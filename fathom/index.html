<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fathom</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stage"></canvas>

<div id="menu"></div>
<div id="hud"></div>

<script src="js/rng.js"></script>
<script src="js/noise.js"></script>
<script src="js/tiles.js"></script>
<script src="js/worldgen.js"></script>
<script src="js/chunks.js"></script>
<script src="js/autotile.js"></script>
<script src="js/texture.js"></script>
<script src="js/light.js"></script>
<script src="js/player.js"></script>
<script src="js/mining.js"></script>
<script src="js/profile.js"></script>
<script src="js/craft.js"></script>
<script src="js/inventory.js"></script>
<script src="js/stats.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/menu.js"></script>
<script src="js/game.js"></script>
<script>
(function boot() {
  const deps = {
    tiles: { AIR, TILES, BY_KEY, tile, isSolid, opacityOf, emitOf, idOf,
      NO_WALL, WALLS, WALL_BY_KEY, wall, wallOpacityOf, wallIdOf },
    worldgen: { CHUNK, WORLD_H, SKY_H, STRUCTURE_MARGIN, BIOMES, ORE_BANDS,
      biomeAt, surfaceHeight, baseTileAt, baseWallAt, treeAt, generateChunk },
    chunks: { makeWorld },
    autotile: { maskAt, edges, exposure, isBuried },
    texture: { TILE, VARIANTS, bakeAtlas, variantFor, shade },
    light: { makeLightField, sunTint, sunStrength, solarElevation, EMIT_TINTS },
    player: { makePlayer, step, overlapsSolid, unstick, aimTile, inLiquid, submerged, REACH },
    mining: { TOOLS, TIER_COLOURS, BREAK_AT, toolSpec, isTool, tierColour, powerOf,
      useTimeOf, requirementOf, toughnessOf, canMine, damagePerHit, hitsFor, secondsFor, requirementName },
    noise: { fbm1, fbm2, ridged2, value1, value2, smooth },
    render: { makeRenderer },
    craft: { RECIPES, ITEMS, STATION_REACH_X, STATION_REACH_Y, stationsNear,
      canAfford, available, atStation, craft, kindOf, nameOf },
    inventory: { makeInventory, LAYOUT, STACK_MAX },
    stats: { makeStats, step: stepStats, damage, heal, spendMana, respawn, raiseMaxHealth, raiseMaxMana, hearts, stars },
    ui: { makeUI },
    profile: { makeProfiles, parseSeed, SKIN_TONES, HAIR_COLOURS, SHIRT_COLOURS, PANTS_COLOURS },
    menu: { makeMenu }
  };
  const game = makeGame(document.getElementById('stage'), deps);
  game.start();
  window.fathom = game;
})();
</script>
</body>
</html>
