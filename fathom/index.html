<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fathom</title>
<link rel="stylesheet" href="style.css?v=astral-siege-1">
</head>
<body>
<canvas id="stage"></canvas>
<canvas id="minimap"></canvas>

<div id="menu"></div>
<div id="hud"></div>
<div id="touch-controls" hidden aria-label="Touch controls">
  <div class="touch-move">
    <button data-touch-hold="left" aria-label="Move left">◀</button>
    <button data-touch-hold="right" aria-label="Move right">▶</button>
    <button data-touch-hold="down" aria-label="Climb down">▼</button>
  </div>
  <div class="touch-act">
    <button data-touch-action="mode" aria-pressed="false">Dig / attack</button>
    <button data-touch-action="hook" aria-label="Grapple at target">Hook</button>
    <button data-touch-hold="jump" aria-label="Jump or climb">Jump</button>
  </div>
  <div class="touch-menu">
    <button data-touch-action="bag">Bag</button>
    <button data-touch-action="map">Map</button>
    <button data-touch-action="zoomOut" aria-label="Zoom out">−</button>
    <button data-touch-action="zoomIn" aria-label="Zoom in">+</button>
    <button data-touch-action="pause">Pause</button>
    <button data-touch-action="house">House</button>
  </div>
</div>

<script src="js/registry.js"></script>
<script src="js/rng.js"></script>

<script src="js/mining.js?v=astral-siege-1"></script>
<script src="js/profile.js"></script>
<script src="js/liquid.js?v=astral-siege-1"></script>
<script src="js/loot.js"></script>
<script src="js/craft.js?v=astral-siege-1"></script>
<script src="js/enemy.js?v=astral-siege-1"></script>
<script src="js/inventory.js?v=astral-siege-1"></script>
<script src="js/stats.js"></script>
<script src="js/housing.js"></script>
<script src="js/villager.js?v=void-1"></script>

<script src="js/ui.js?v=astral-siege-1"></script>
<script src="js/menu.js"></script>
<script src="js/touch.js"></script>
<script src="js/wiring.js?v=astral-siege-1"></script>
<script src="js/game.js?v=astral-siege-1"></script>
<script>
(function boot() {
  const game = makeGame(document.getElementById('stage'), FATHOM);
  game.start();
  window.fathom = game;
})();
</script>
</body>
</html>
