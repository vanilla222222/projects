<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wildroot responsive checks</title><style>
*{box-sizing:border-box}body{margin:0;background:#202e36;color:#f1e1b7;font:14px system-ui}header{height:48px;display:flex;align-items:center;justify-content:center;gap:10px;padding:6px}button{border:1px solid #879b8b;background:#40554d;color:inherit;padding:8px 14px;cursor:pointer}button[aria-pressed=true]{background:#8c7547}main{display:flex;justify-content:center;min-width:max-content;padding:8px}iframe{display:block;box-sizing:content-box;width:390px;height:844px;border:5px solid #11212b;border-radius:8px;background:#253a35}small{color:#a5bab7}
</style></head><body><header><strong>Display checks</strong><button data-size="390,844" aria-pressed="true">Phone · 390 × 844</button><button data-size="844,390" aria-pressed="false">Landscape · 844 × 390</button><button data-size="1160,780" aria-pressed="false">Desktop · 1160 × 780</button><small>Uses the normal browser save</small></header><main><iframe id="game-frame" title="Wildroot game viewport" src="../index.html?v=34"></iframe></main><script>
document.addEventListener('click',e=>{const b=e.target.closest('[data-size]');if(!b)return;const[w,h]=b.dataset.size.split(',').map(Number),frame=document.getElementById('game-frame');frame.style.width=w+'px';frame.style.height=h+'px';for(const button of document.querySelectorAll('[data-size]'))button.setAttribute('aria-pressed',String(button===b));});
</script></body></html>
