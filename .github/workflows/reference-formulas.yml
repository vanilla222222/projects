name: Reference formula validation
on:
  push:
    paths:
      - '.github/workflows/reference-formulas.yml'
      - 'molecule profiler/tools/verify-reference-formulas.py'
  workflow_dispatch:
jobs:
  verify-and-repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install rdkit
      - name: Verify formulas and fill missing entries
        working-directory: molecule profiler
        run: python tools/verify-reference-formulas.py --write-missing --report reference-formula-report.json
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-formula-report
          path: molecule profiler/reference-formula-report.json
      - name: Commit repaired formulas
        run: |
          if ! git diff --quiet -- 'molecule profiler/data/library.js'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- 'molecule profiler/data/library.js'
            git commit -m "Fill missing molecular formulas calculated from SMILES"
            git push
          fi
