name: RDKit structure quality audit
on:
  push:
    paths:
      - 'molecule profiler/data/library.js'
      - 'molecule profiler/tools/rdkit-library-audit.py'
      - '.github/workflows/rdkit-structure-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install rdkit
      - name: Audit molecular structures
        working-directory: molecule profiler
        run: python tools/rdkit-library-audit.py --output rdkit-audit.json
      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdkit-structure-audit
          path: molecule profiler/rdkit-audit.json
