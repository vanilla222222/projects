name: Molecule Profiler regression tests
on:
  push:
    paths:
      - 'molecule profiler/**'
      - '.github/workflows/molecule-profiler-tests.yml'
  pull_request:
    paths:
      - 'molecule profiler/**'
      - '.github/workflows/molecule-profiler-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: molecule profiler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runner environment
        run: |
          echo "RUN_ID=$GITHUB_RUN_ID"
          echo "HEAD_SHA=$GITHUB_SHA"
          node --version
          python --version
          pwd
      - name: Syntax-check browser and Node scripts
        shell: bash
        run: |
          set -o pipefail
          ( find js data tools -name '*.js' -print0 | xargs -0 -n1 node --check
            node --check reference-audit.js
            node --check reference-explorer.js
          ) 2>&1 | tee syntax-check.log
      - name: Run complete JavaScript validation
        shell: bash
        run: |
          set -o pipefail
          node tools/run-validation.js --report validation-report.json 2>&1 | tee validation-console.log
      - name: Independent ZIP extraction and manifest check
        run: python3 tools/verify-research-zip.py
      - name: Upload JavaScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molecule-profiler-js-diagnostics
          path: |
            molecule profiler/syntax-check.log
            molecule profiler/validation-console.log
            molecule profiler/validation-report.json
          if-no-files-found: warn
          retention-days: 14
  rdkit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: molecule profiler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python and RDKit environment
        run: |
          python --version
          python -m pip install rdkit
          python -c "from rdkit import rdBase; print('RDKit',rdBase.rdkitVersion)"
      - name: Run RDKit structural audit
        shell: bash
        run: |
          set -o pipefail
          python tools/rdkit-library-audit.py --output rdkit-audit.json 2>&1 | tee rdkit-audit.log
      - name: Upload structure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molecule-profiler-rdkit-diagnostics
          path: |
            molecule profiler/rdkit-audit.json
            molecule profiler/rdkit-audit.log
          if-no-files-found: warn
          retention-days: 14
