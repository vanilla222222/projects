name: Molecule Profiler browser end-to-end tests
on:
  push:
    paths:
      - 'molecule profiler/**'
      - '.github/workflows/molecule-profiler-browser.yml'
  pull_request:
    paths:
      - 'molecule profiler/**'
      - '.github/workflows/molecule-profiler-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Exercise real browser workflows
        working-directory: molecule profiler
        env:
          BROWSER_TEST_ARTIFACTS: browser-test-artifacts
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -o pipefail
          python tools/browser-e2e.py 2>&1 | tee browser-test-artifacts.log
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: molecule-profiler-browser-screenshots
          path: |
            molecule profiler/browser-test-artifacts/
            molecule profiler/browser-test-artifacts.log
          if-no-files-found: warn
          retention-days: 14
