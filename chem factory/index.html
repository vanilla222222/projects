<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chem Factory</title>
<link rel="stylesheet" href="style.css?v=27">
</head>
<body>
<header id="top">
  <a class="back" href="../index.html" title="Back to projects">‹</a>
  <span class="brand">Chem Factory</span>
  <span class="sp"></span>
  <button data-ui="craft" title="Inventory and crafting (E)">Inventory <kbd>E</kbd></button>
  <button data-ui="ency" title="Encyclopedia (H)">Encyclopedia <kbd>H</kbd></button>
  <button data-ui="map" title="World map (M)">Map <kbd>M</kbd></button>
  <button data-ui="ach" title="Achievements (J)">Achievements <kbd>J</kbd></button>
  <button data-ui="help">Help</button>
  <button data-ui="reset" class="danger">New world</button>
</header>
<main id="stage">
  <canvas id="cv"></canvas>
  <aside id="hud"><div class="hmap"><canvas id="mini" width="200" height="200" title="Click: open the map · Wheel: zoom"></canvas><div class="hzb"><button data-mz="1" title="Zoom in">+</button><button data-mz="-1" title="Zoom out">−</button></div></div><div id="clock" title="Click to switch the day and night cycle on or off"></div><button id="hstog" title="Show or hide the stats">Stats</button><div id="hstat"><div id="power"></div><div id="vent"></div></div></aside>
  <aside id="panel" hidden></aside>
  <div id="tip" hidden></div>
  <div id="toast"></div>
</main>
<section id="factoryTouch" hidden aria-label="Touch controls">
  <div class="factory-dpad" aria-label="Movement">
    <button data-move="w" aria-label="Move up">▲</button>
    <button data-move="a" aria-label="Move left">◀</button>
    <button data-move="s" aria-label="Move down">▼</button>
    <button data-move="d" aria-label="Move right">▶</button>
  </div>
  <div class="factory-touch-actions">
    <select id="factoryTouchMode" aria-label="Map touch mode">
      <option value="act">Build / use</option><option value="pan">Pan view</option><option value="remove">Remove</option>
      <option value="wire">Wire / paste</option><option value="copy">Copy setup</option>
      <option value="take">Quick take</option><option value="fill">Quick fill</option>
    </select>
    <button data-touch-key="f">Use / exit</button><button data-touch-key="r">Rotate</button>
    <button data-touch-key="Escape">Clear</button><button data-touch-key="x">Weapon</button>
    <button data-touch-key="g">Throw</button><button data-touch-key="n">Net</button>
    <button data-touch-key="t">Research</button><button data-touch-key="p">Gear</button>
    <button data-touch-key="Alt">Recipes</button><button data-touch-key="v">Overlay</button>
    <button data-touch-zoom="-1" aria-label="Zoom in">＋</button><button data-touch-zoom="1" aria-label="Zoom out">−</button>
    <button data-touch-center>Center</button>
  </div>
</section>
<nav id="hotbar"></nav>
<div id="modal" hidden>
  <div class="mwin">
    <div class="mhead"><div class="tabs"></div><button class="x" data-ui="close" title="Close">×</button></div>
    <div class="mbody"></div>
  </div>
</div>
<script src="data.js?v=125"></script>
<script src="game.js?v=125"></script>
<script src="touch.js"></script>
</body>
</html>
