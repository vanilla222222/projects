<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla's Projects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
    <div class="backdrop" aria-hidden="true"></div>

    <div class="shell">
        <header class="topbar">
            <div class="brand">
                <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                    <defs>
                        <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#7c8cf8"/>
                            <stop offset="1" stop-color="#4fd1e0"/>
                        </linearGradient>
                    </defs>
                    <path d="M16 3 27 9.5v13L16 29 5 22.5v-13z" fill="none" stroke="url(#brand-grad)" stroke-width="2.4" stroke-linejoin="round"/>
                    <circle cx="16" cy="16" r="3.2" fill="url(#brand-grad)"/>
                </svg>
                <div>
                    <p class="brand-title">Project Index</p>
                    <p class="brand-sub">~/Downloads/projects</p>
                </div>
            </div>
            <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle light and dark theme">
                <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
        </header>

        <section class="hero">
            <p class="eyebrow"><span class="dot"></span>Made by vanilla</p>
            <h1>Things I've built.</h1>
            <p class="lede">Simulations, games and tools. Pick one to launch it.</p>

            <div class="toolbar">
                <label class="search-box">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <input type="search" id="search" placeholder="Search projects" autocomplete="off" spellcheck="false">
                    <kbd>/</kbd>
                </label>
                <p class="count"><span id="count">0</span> projects</p>
            </div>
        </section>

        <main>
            <div id="project-grid" class="grid"></div>
            <p id="empty" class="empty" hidden>No projects match that search.</p>
        </main>

        <footer class="footer">
            <span>Made with care by <strong class="signature">vanilla</strong></span>
            <span class="footer-hint"><kbd>/</kbd> search <kbd>↵</kbd> open first result</span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
