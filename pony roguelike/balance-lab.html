<style>
body{font-family:system-ui,sans-serif;background:#12131a;color:#e6e6f0;margin:0;padding:16px}
h1{font-size:20px;margin:0 0 10px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:10px}
label{font-size:13px}input,select{background:#1d2030;color:#e6e6f0;border:1px solid #3a3f5a;padding:4px 6px;border-radius:4px}
button{background:#3b6fe0;color:#fff;border:0;padding:8px 14px;border-radius:5px;cursor:pointer}button:disabled{opacity:.5}
#log{background:#0b0c12;height:110px;overflow:auto;padding:8px;font:12px monospace;white-space:pre-wrap;border-radius:5px}
#out{width:100%;height:420px;background:#0b0c12;color:#cfd3ea;font:12px monospace;border:1px solid #3a3f5a;border-radius:5px;margin-top:10px;box-sizing:border-box}

<h1>Balance Lab</h1>
<div class="row">
<label>Class <select id="cls"></select></label>
<label>Seconds per enemy <input id="secs" type="number" value="15" min="3" max="60" style="width:60px"></label>
<label>Stage filter (e.g. 14, 15C; blank = all) <input id="stage" style="width:70px"></label>
<label><input id="quick" type="checkbox"> Quick (every 4th enemy)</label>
<label><input id="sim" type="checkbox" checked> Run enemy simulation</label>
<label><input id="syn" type="checkbox"> Synergy mode</label>
<label>Sec/duel <input id="synsecs" type="number" value="6" min="2" max="20" style="width:50px"></label>
<label>Pair top-N items (0 = skip pairs) <input id="pairtop" type="number" value="40" min="0" max="120" style="width:55px"></label>
<label><input id="real" type="checkbox"> Real damage</label>
<label><input id="move" type="checkbox"> Moving player</label>
<label>Cross-class count <input id="clscount" type="number" value="3" min="1" max="8" style="width:45px"></label>
<label><input id="boss" type="checkbox"> Boss duels</label>
<label>Boss sec <input id="bosssecs" type="number" value="45" min="10" max="120" style="width:50px"></label>
<button id="run">Run</button><button id="baseline">Save as baseline</button><button id="download">Download</button><button id="copy">Copy results</button><span id="progress"></span>
</div>
<div id="log"></div>
<textarea id="out" placeholder="Results appear here"></textarea>
